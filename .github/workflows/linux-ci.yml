name: Linux foundation checks

on:
  push:
    branches:
      - feature/linux-chromium-rewrite
    paths:
      - "linux/**"
      - ".github/workflows/linux-ci.yml"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "linux/**"
      - ".github/workflows/linux-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Unit tests, typecheck and Electron build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: linux
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.22.3

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run unit tests
        run: npm test

      - name: TypeScript check
        run: npm run typecheck

      - name: Build Electron application
        run: npm run build

      - name: Chromium WebContentsView smoke test
        run: xvfb-run -a npm run smoke

      - name: Install pacman package build utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools

      - name: Build native Arch package
        run: npm run package:pacman

      - name: Validate and install package in Arch Linux container
        run: |
          docker run --rm \
            -v "$PWD/release:/packages:ro" \
            -v "$PWD/packaging/arch/ci-install-test.sh:/ci-install-test.sh:ro" \
            archlinux:base bash /ci-install-test.sh

      - name: Upload Arch package
        uses: actions/upload-artifact@v4
        with:
          name: AIHub-Studio-Linux-Arch-x64
          path: linux/release/*
          if-no-files-found: error
