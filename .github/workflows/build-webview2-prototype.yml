name: Build WebView2 Capture Prototype MSI
on:
  workflow_dispatch:
  push:
    branches:
      - feature/webview2-local-chat-archive
    paths:
      - 'prototype/webview2-capture/**'
      - '.github/workflows/build-webview2-prototype.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    env:
      APP_VERSION: 0.1.2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Validate capture script JavaScript syntax
        run: node --check prototype/webview2-capture/CaptureScript.js
      - name: Restore win-x64 dependencies
        run: dotnet restore prototype/webview2-capture/AIHub.WebView2Capture.csproj --runtime win-x64
      - name: Publish self-contained x64 application
        run: dotnet publish prototype/webview2-capture/AIHub.WebView2Capture.csproj --configuration Release --runtime win-x64 --self-contained true --no-restore --output publish
      - name: Install pinned WiX Toolset v5
        shell: pwsh
        run: |
          dotnet tool install --tool-path .wix wix --version 5.0.2
          .\\.wix\\wix.exe --version
      - name: Build x64 MSI
        shell: pwsh
        run: .\\.wix\\wix.exe build prototype/webview2-capture/Installer.wxs -arch x64 -out AIHub-WebView2-Capture-Prototype-v0.1.2-x64.msi
      - name: Upload test MSI
        uses: actions/upload-artifact@v4
        with:
          name: AIHub-WebView2-Capture-v0.1.2-Windows-x64
          path: AIHub-WebView2-Capture-Prototype-v0.1.2-x64.msi
          if-no-files-found: error
          retention-days: 14
