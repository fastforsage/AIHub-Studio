name: Build Windows MSI
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Build standalone application
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --name AIHubStudio --collect-all PySide6 --collect-all keyring --hidden-import keyring.backends.Windows --hidden-import PySide6.QtWebEngineWidgets --hidden-import PySide6.QtWebEngineCore app/main.py
          New-Item -ItemType Directory -Force publish | Out-Null
          Copy-Item -Recurse dist/AIHubStudio/* publish/
      - name: Install pinned WiX Toolset v5
        shell: pwsh
        run: |
          dotnet tool install --tool-path .wix wix --version 5.0.2
          .\\.wix\\wix.exe --version
      - name: Build x64 MSI
        shell: pwsh
        run: .\\.wix\\wix.exe build installer/Product.wxs -arch x64 -out AIHubStudio-Setup-x64.msi
      - uses: actions/upload-artifact@v4
        with:
          name: AIHubStudio-Windows10-x64-MSI
          path: AIHubStudio-Setup-x64.msi
          if-no-files-found: error
      - name: Attach MSI to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: AIHubStudio-Setup-x64.msi
